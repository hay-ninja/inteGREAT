<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>inteGREAT Phone Camera</title><link rel="stylesheet" href="/phone/style.css"></head>
<body><main><h1>Phone camera</h1><p>Send your rear camera directly to your laptop. No audio, cloud service, or recording.</p>
<video id="preview" autoplay muted playsinline aria-label="Camera preview"></video>
<p id="status" role="status">Tap Start and allow camera access. Keep Safari visible while streaming.</p>
<button id="start">Start camera</button><button id="stop" disabled>Stop camera</button>
<p>Stop closes the camera and revokes this pairing. Create a new link on the laptop to start again.</p>
</main><script src="/phone/capture.js" defer></script></body></html>
