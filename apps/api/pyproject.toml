[project]
name = "integreat"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6",
  "tree-sitter>=0.23",
  "tree-sitter-cpp>=0.23",
  "pyserial>=3.5",
  "opencv-python>=4.8",
  "numpy>=1.26",
  "google-genai>=1.0",
  "defusedxml>=0.7",
  "httpx>=0.27",
  "cryptography>=43",
  "sentry-sdk>=2.72,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
integreat = ["api/phone_assets/*"]
